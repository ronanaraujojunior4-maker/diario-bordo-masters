<!doctype html><html lang="pt-BR"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A1730">
<meta charset="utf-8">
<title>Diário de Bordo Masters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="assets/symbol.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Diário Masters">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sidebar azul-marinho fixa + área de trabalho clara; no celular, barra inferior + gaveta. */
:root{
  --navy:#0A1730; --navy-2:#11234A; --graphite:#2A303B;
  --electric:#2F6BFF; --cyan:#17C3DC;
  --ok:#16A34A; --warn:#D98A00; --crit:#DC2626;
  --bg:#EEF2F8; --surface:#FFFFFF; --surface-2:#F6F8FC; --line:#DCE3EE;
  --fg:#16202F; --muted:#5B6678; --accent:var(--electric); --accent-soft:#E6EEFF;
  --ok-soft:#E3F6EA; --warn-soft:#FFF3D6; --crit-soft:#FDE7E7; --cyan-soft:#DDF7FB;
  --shadow:0 1px 2px rgba(10,23,48,.06),0 6px 20px rgba(10,23,48,.06);
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --side:252px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070E1C; --surface:#0F1A2E; --surface-2:#13203A; --line:#22324F; --fg:#E6ECF5; --muted:#93A1B8;
  --accent:#5B8CFF; --accent-soft:#18284A; --ok-soft:#0F2A1C; --warn-soft:#2E2208; --crit-soft:#331214; --cyan-soft:#0C2A31;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070E1C; --surface:#0F1A2E; --surface-2:#13203A; --line:#22324F; --fg:#E6ECF5; --muted:#93A1B8;
  --accent:#5B8CFF; --accent-soft:#18284A; --ok-soft:#0F2A1C; --warn-soft:#2E2208; --crit-soft:#331214; --cyan-soft:#0C2A31;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:17px} h3{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* faixa demo */
.demo-band{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:repeating-linear-gradient(135deg,#D98A00 0 14px,#E9A21B 14px 28px);color:#1d1400;font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;text-align:center;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:#D98A00}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--navy)}
.login-art{position:relative;overflow:hidden;color:#DCE6FA;padding:48px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(900px 500px at 10% 110%,rgba(23,195,220,.22),transparent 60%),radial-gradient(700px 500px at 90% -10%,rgba(47,107,255,.35),transparent 60%),var(--navy)}
.login-art canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.login-art > *{position:relative}
.login-art h1{font-size:clamp(30px,4vw,46px);color:#fff;max-width:14ch;line-height:1.05}
.login-art p{max-width:46ch;color:#AFC0DE}
.logo-chip{background:#fff;border-radius:10px;padding:8px 12px;display:inline-flex;align-items:center}
.logo-chip img{height:30px;display:block}
.login-form{background:var(--surface);display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-form form{width:min(380px,100%);display:grid;gap:14px}
.demo-users{display:flex;flex-wrap:wrap;gap:8px}
.demo-users button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.demo-users button:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-art{padding:28px 20px;min-height:260px}}

/* shell */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100% - 28px)}
.app.collapsed{--side:76px}
.side{background:linear-gradient(180deg,var(--navy),#0B1B3A 60%,#0D2147);color:#C9D5EC;position:sticky;top:calc(env(safe-area-inset-top,0px) + 28px);height:calc(100vh - 28px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:16px 12px;gap:6px;transition:width .2s}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.side .brand img{height:26px}
.side .brand .logo-chip{padding:6px 10px}
.app.collapsed .brand .logo-chip{padding:6px}
.app.collapsed .brand .wide,.app.collapsed .side .lbl,.app.collapsed .side .grp{display:none}
.brand .narrow{display:none;height:26px}
.app.collapsed .brand .narrow{display:block}
.side .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6F82A8;padding:12px 10px 4px}
.side a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500;position:relative;transition:background .15s,color .15s}
.side a:hover{background:rgba(255,255,255,.06);color:#fff}
.side a.on{background:linear-gradient(90deg,rgba(47,107,255,.32),rgba(23,195,220,.12));color:#fff}
.side a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--cyan)}
.side{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:0}
.side .foot{margin-top:auto;display:grid;gap:6px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px;position:sticky;bottom:0;background:#0D2147;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:1}
.side button.lnk{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;border:0;background:none;color:inherit;cursor:pointer;text-align:left}
.side button.lnk:hover{background:rgba(255,255,255,.06);color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:6px 8px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--electric),var(--cyan));color:#fff;font-weight:700;font-size:12px;flex:none}
.me .who{line-height:1.2;min-width:0}.me .who b{color:#fff;display:block;font-size:13px}.me .who span{font-size:11px;color:#8EA0C4}
.app.collapsed .me .who{display:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding-block:18px 6px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top .crumbs{min-width:0}
.top .crumbs small{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.top .grow{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.mode-pill{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--warn-soft);color:var(--warn);font-weight:600;white-space:nowrap}
.page{padding-block:10px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:18px;animation:in .22s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* superfícies */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card > header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card > header .grow{flex:1}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-dash{grid-template-columns:1fr}}
@media (max-width:720px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(132px,40vw),1fr));gap:12px}
.kpis.k8{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.kpis.k8{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;position:relative;overflow:hidden}
.kpi .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font:600 22px/1.15 var(--f-display);white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--tone,var(--accent));opacity:.8}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-crit{background:var(--crit-soft);color:var(--crit)}.p-info{background:var(--accent-soft);color:var(--accent)}.p-cyan{background:var(--cyan-soft);color:#0E8EA2}.p-mute{background:var(--surface-2);color:var(--muted)}
.plate{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.06em;border:1.5px solid var(--fg);border-radius:5px;padding:1px 7px;display:inline-block;background:var(--surface);white-space:nowrap}

/* frota */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.veh{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--surface-2);transition:transform .15s,border-color .15s}
.veh:hover{transform:translateY(-1px);border-color:var(--accent)}
.veh .row{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.veh .km{font:600 20px var(--f-mono)}
.veh dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:12px}.veh dt{color:var(--muted)}.veh dd{margin:0;text-align:right}

/* formulários */
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.f .w{grid-column:1/-1}
label.fld{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;font-weight:400;color:var(--fg);width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld input[readonly]{background:var(--surface-2)}
.fld .hint{font-weight:400;font-size:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;transition:filter .15s,transform .05s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.danger{background:var(--crit)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 10px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.msg.err{background:var(--crit-soft);color:var(--crit)}.msg.warn{background:var(--warn-soft);color:var(--warn)}.msg.info{background:var(--accent-soft);color:var(--accent)}.msg.ok{background:var(--ok-soft);color:var(--ok)}
.lastkm{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;background:linear-gradient(90deg,var(--cyan-soft),transparent);border:1px solid var(--line)}
.lastkm b{font:600 22px var(--f-mono)}

/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 10px;white-space:nowrap;position:sticky;top:0}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.flag td{background:var(--warn-soft)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.list{display:grid;gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--surface-2)}
.li .ico{margin-top:2px}
.li .t{min-width:0;flex:1}
.chart-box{position:relative;height:260px}

/* diálogo e toast */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(7,14,28,.55);backdrop-filter:blur(2px)}
dialog .dh{padding:18px 18px 0}.dialog-body{padding:14px 18px;display:grid;gap:12px}.dialog-foot{padding:0 18px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60}
.toast{background:var(--graphite);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);animation:in .2s;max-width:340px}

/* resumo da operação e recuperação de acesso */
.resumo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ri{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;min-width:0}
.ri>div{display:grid;gap:2px;min-width:0}.ri .k{font-size:12px;color:var(--muted);font-weight:600}.ri .v{font-family:var(--f-display);font-size:22px;line-height:1.15;overflow-wrap:anywhere}.ri .s{font-size:12px;color:var(--muted)}
.ri-i{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--tone) 14%,transparent);color:var(--tone)}
@media (max-width:420px){.resumo{grid-template-columns:1fr}}
.lnk-rec{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left;justify-self:start}
.lnk-rec:hover{text-decoration:underline}
fieldset.rec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;margin:0}
fieldset.rec legend{font-weight:700;padding:0 6px}

.btn.danger-t{color:var(--crit)}
fieldset.tq{border:0;margin:0;padding:0;min-width:0}fieldset.tq legend{padding:0;margin-bottom:6px;font-size:13px;font-weight:600}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:500}
.seg label:has(input:checked){border-color:var(--accent);background:rgba(47,107,255,.08)}
.msg.acoes-op{flex-wrap:wrap;align-items:center}.msg.acoes-op>span:not(.acoes-bt){flex:1 1 240px}.acoes-bt{display:flex;gap:8px;flex-wrap:wrap}.acoes-bt .btn{min-height:44px;text-decoration:none}
.side .ver{font-size:11px;color:#6F82A8;padding:0 10px}
/* registro selecionável + barra de ações */
tr.selable{cursor:pointer}tr.selable:hover td{background:rgba(47,107,255,.05)}
tr.selable:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tr.sel td{background:rgba(47,107,255,.14)!important}tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.selbar{position:fixed;z-index:35;left:calc(var(--side) + 24px);right:24px;bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(7,14,28,.18);padding:12px 14px}
.selbar[hidden]{display:none}
.selbar .sb-t{flex:1 1 260px;display:grid;gap:2px;min-width:0}.selbar .sb-t small,.selbar .sb-t span{color:var(--muted);font-size:12px}
.selbar .sb-a{display:flex;gap:8px;flex-wrap:wrap}.selbar .btn{min-height:44px;min-width:96px;justify-content:center}
.page{padding-bottom:120px}
.kpi .fo{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0}.kpi .fo span{display:grid;font-size:11px;color:var(--muted);line-height:1.2}.kpi .fo b{font-family:var(--f-display);font-size:22px;color:var(--fg)}

/* celular */
.bottom{display:none}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:280px;z-index:45;transform:translateX(-100%);transition:transform .22s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:calc(12px + env(safe-area-inset-left,0px))}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(7,14,28,.5);z-index:44}
  .app.collapsed{--side:0}
  .app.collapsed .lbl,.app.collapsed .grp,.app.collapsed .brand .wide,.app.collapsed .me .who{display:revert}
  .app.collapsed .brand .narrow{display:none}
  #collapse{display:none}
  .top,.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .page{padding-bottom:180px}
  .selbar{left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:10px 12px}
  .selbar .sb-a{width:100%}.selbar .sb-a .btn{flex:1}
  h1{font-size:20px}
  .bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottom a,.bottom button{display:grid;justify-items:center;gap:2px;padding:8px 4px;font-size:11px;color:var(--muted);text-decoration:none;border:0;background:none;cursor:pointer}
  .bottom .on{color:var(--accent)}
}
@media (min-width:901px){#burger{display:none}}
</style>

<div class="demo-band" id="demoBand">Ambiente de demonstração · dados fictícios · isolado do sistema oficial</div>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
